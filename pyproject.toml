[project]
name = "crypto-market-data"
version = "0.1.0"
description = "Binance WebSocket 实时数据采集与秒级聚合系统"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
"websockets>=12.0",
"aiohttp>=3.9.0",
"requests>=2.31.0",
"pandas>=2.2.0",
"numpy>=1.26.0",
"pydantic>=2.6.0",
"pydantic-settings>=2.2.0",
"structlog>=24.1.0",
"python-dateutil>=2.9.0",
"redis>=5.0.0",
"aiosqlite>=0.20.0",
"apscheduler>=3.10.0",
"fastapi>=0.115.0",
"uvicorn[standard]>=0.32.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "black>=24.1.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
    "fakeredis>=2.20.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
